syntax = "proto3";

package auth;

option go_package = "github.com/Kisanlink/pkg/proto";

import "google/protobuf/timestamp.proto";

// AuthService provides authentication services
service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// AuthorizationService provides authorization services
service AuthorizationService {
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

// ValidateTokenRequest represents a token validation request
message ValidateTokenRequest {
  string token = 1;
}

// ValidateTokenResponse represents a token validation response
message ValidateTokenResponse {
  bool valid = 1;
  TokenClaims claims = 2;
}

// Role represents a role with full details from JWT
message Role {
  string id = 1;
  string name = 2;
  string scope = 3;
  string description = 4;
  string parent_id = 5;
  bool is_active = 6;
  repeated string permissions = 7;
}

// UserRole represents a user-role association from JWT
message UserRole {
  string id = 1;
  string user_id = 2;
  string role_id = 3;
  bool is_active = 4;
  Role role = 5;
}

// Organization represents user organization details
message Organization {
  string id = 1;
  string name = 2;
  string tenant_id = 3;
}

// Group represents user group details
message Group {
  string id = 1;
  string name = 2;
  string organization_id = 3;
  string description = 4;
}

// UserContextDetails represents nested user_context from JWT v2.0
message UserContextDetails {
  string id = 1;
  string username = 2;
  string phone_number = 3;
  string country_code = 4;
  bool is_validated = 5;
  repeated Role roles = 6;
  repeated Organization organizations = 7;
  repeated Group groups = 8;
}

// TokenClaims represents JWT token claims
message TokenClaims {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string phone_number = 4;
  string country_code = 5;
  string tenant_id = 6;
  string organization_id = 7;
  string organization_name = 8;
  repeated string roles = 9;
  repeated string role_ids = 10;
  repeated string permissions = 11;
  repeated string scopes = 12;
  int64 issued_at = 13;
  int64 expires_at = 14;
  int64 not_before = 15;
  string issuer = 16;
  string audience = 17;
  bool is_validated = 18;
  repeated UserRole user_roles = 19;
  repeated Organization organizations = 20;
  repeated Group groups = 21;
  string token_type = 22;
  string token_version = 23;
  string sub = 24;
  string session_id = 25;
  string jti = 26;
  string tenant_context = 27; // JSON string for flexibility
  UserContextDetails user_context = 28;
}

// AuthorizeRequest represents an authorization request
message AuthorizeRequest {
  string user_id = 1;
  string tenant_id = 2;
  string resource = 3;
  string action = 4;
  string resource_id = 5;
}

// AuthorizeResponse represents an authorization response
message AuthorizeResponse {
  bool allowed = 1;
  string reason = 2;
}

// HealthCheckRequest represents a health check request
message HealthCheckRequest {}

// HealthCheckResponse represents a health check response
message HealthCheckResponse {
  string status = 1;
}
