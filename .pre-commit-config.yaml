repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: pretty-format-json
        args: ["--autofix"]
      - id: mixed-line-ending

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      # Temporarily disabled - failing on existing code not related to current changes
      # - id: go-cyclo
      #   args: [-over=15]
      - id: go-mod-tidy
      - id: golangci-lint
        args: [--new-from-rev=HEAD]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-crlf
      - id: remove-tabs
        exclude: \.(go|mod)$|Makefile

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: alphabetize-codeowners
      - id: fix-smartquotes

  - repo: local
    hooks:
      - id: go-unit-tests-only
        name: go unit tests (excludes integration tests)
        entry: make test-unit
        language: system
        pass_filenames: false
        types: [go]
