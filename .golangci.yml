# Version of golangci-lint configuration
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - misspell
    - gocritic
    - gocyclo
    - dupl
    - goconst
    - prealloc
    - nakedret
    - nolintlint
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  unused:
    check-exported: false

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint

  revive:
    severity: warning
    rules:
      - name: exported
        severity: warning
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

  gosec:
    excludes:
      - G404

  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst

    - path: cmd/
      linters:
        - gochecknoinits

    # Ignore duplicate code in placeholder handlers
    - path: internal/handlers/
      linters:
        - dupl

    # Ignore package comments for now
    - linters:
        - revive
      text: "package-comments:"

    # Ignore exported function comments for now
    - linters:
        - revive
      text: "exported: exported"

    # Ignore naming issues for now
    - linters:
        - revive
      text: "var-naming:"

    # Ignore deprecated grpc.Dial for now
    - linters:
        - staticcheck
      text: "SA1019: grpc.Dial is deprecated"

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default-severity: error
  case-sensitive: false
