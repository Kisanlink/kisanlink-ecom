run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

issues:
  exclude-dirs:
    - vendor
    - bin
    - scripts
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"
  uniq-by-line: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false # More relaxed for development
  
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  
  gocyclo:
    min-complexity: 20 # More relaxed
  
  dupl:
    threshold: 150 # More relaxed
  
  goconst:
    min-len: 3
    min-occurrences: 5 # More relaxed
  
  misspell:
    locale: US
  
  unused:
    check-exported: false
  
  unparam:
    check-exported: false
  
  nakedret:
    max-func-lines: 40 # More relaxed
  
  prealloc:
    simple: true
    range-loops: true
    for-loops: false
  
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - commentedOutCode
      - unnecessaryBlock
  
  gofumpt:
    extra-rules: false # More relaxed
  
  revive:
    severity: warning
    confidence: 0.8
    rules:
      - name: exported
        severity: warning
        disabled: true # Disabled for development
  
  gosec:
    excludes:
      - G404 # Random number source
      - G304 # File path provided as taint input
  
  lll:
    line-length: 140 # More relaxed
  
  fieldalignment:
    suggest-new: false
  
  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

linters:
  disable-all: true
  enable:
    # Essential linters only for development
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    
    # Code quality
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gocyclo
    - gosec

issues:
  exclude-dirs:
    - vendor
    - bin
    - scripts
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"
  uniq-by-line: true
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    - path: cmd/
      linters:
        - gochecknoinits
    # Ignore issues in handlers during development
    - path: internal/handlers/
      linters:
        - dupl
        - errcheck
        - gosec
    # Ignore placeholder code issues
    - text: "implementation needed"
      linters:
        - gosec
        - errcheck
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    
    - path: cmd/
      linters:
        - gochecknoinits
    
    # Ignore issues in handlers during development
    - path: internal/handlers/
      linters:
        - dupl
        - errcheck
        - gosec
    
    # Ignore placeholder code issues
    - text: "implementation needed"
      linters:
        - gosec
        - errcheck
  
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10

severity:
  default-severity: warning
  case-sensitive: false 