openapi: 3.0.3
info:
  title: KisanLink E-commerce API - User Management & Business Logic Modules
  description: |
    Comprehensive API documentation for user management, role-based access control, taxation, SLA,
    discounts, and collaborator management in the KisanLink E-commerce platform.

    This API provides:
    - User management and authentication
    - Role-based access control (User Roles, Organization Roles, E-commerce Roles)
    - Tax exemption management and calculations
    - Service Level Agreement (SLA) management
    - Discount rules and promotions
    - Organization collaborator management

    ## Authentication
    All protected endpoints require JWT authentication via the `Authorization` header with `Bearer <token>` format.
    Tokens are obtained from the AAA (Authentication, Authorization, Accounting) service.

    **Note on Current Implementation:** As of the current implementation state:
    - POST/PUT/DELETE operations: Authentication required (conditionalAuthMiddleware)
    - GET operations: Currently public (no authentication middleware applied)
    - This may change in future versions for security enhancement

    ## Multi-tenancy
    All endpoints support organization-level isolation. The organization context is extracted from:
    - JWT token claims
    - `organization_id` query parameter or request body field

    ## Error Handling
    All errors follow RFC 7807 Problem Details format with structured error codes.

    ## Pagination
    List endpoints support cursor-based pagination with `page` and `limit` parameters.
    Default: page=1, limit=20, max=100

    ## Soft Delete
    Most resources support soft delete. Deleted resources can be recovered and are filtered from list queries by default.
  version: 1.0.0
  contact:
    name: KisanLink API Support
    email: api-support@kisanlink.com
    url: https://docs.kisanlink.com
  license:
    name: Proprietary
    url: https://kisanlink.com/license

servers:
  - url: https://api.kisanlink.com
    description: Production server
  - url: https://staging-api.kisanlink.com
    description: Staging server
  - url: http://localhost:8080
    description: Development server

tags:
  - name: Users
    description: User management operations (references AAA service users)
  - name: User Roles
    description: User-to-role assignment management
  - name: Organization Roles
    description: Organization-specific role configuration
  - name: E-commerce Roles
    description: E-commerce specific role definitions and permissions
  - name: Tax Exemptions
    description: Tax exemption management and calculation
  - name: Service SLAs
    description: Service Level Agreement management for services
  - name: Discount Rules
    description: Discount rule management and evaluation
  - name: Organization Collaborators
    description: Organization collaborator management
  - name: Collaborators
    description: Collaborator operations (fully implemented)

paths:
  # ============================================
  # USER ENDPOINTS
