  /api/v1/collaborators/bulk:
    patch:
      tags: [Collaborators]
      summary: Bulk update collaborators
      description: |
        Updates multiple collaborators in a single request. This endpoint is fully implemented.
      operationId: bulkUpdateCollaborators
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collaborator_ids
                - updates
              properties:
                collaborator_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                updates:
                  type: object
                  properties:
                    status:
                      $ref: "#/components/schemas/CollaboratorStatus"
                    role:
                      $ref: "#/components/schemas/CollaboratorRole"
                    access_level:
                      type: integer
                      minimum: 1
                      maximum: 10
      responses:
        "200":
          description: Bulk update completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count:
                    type: integer
                  failure_count:
                    type: integer
                  updated_ids:
                    type: array
                    items:
                      type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        collaborator_id:
                          type: string
                        error:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the AAA service

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # ============================================
    # COMMON SCHEMAS
    # ============================================
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    ResponseMeta:
      type: object
      properties:
        trace_id:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            trace_id:
              type: string
            timestamp:
              type: string
              format: date-time

    # ============================================
    # USER SCHEMAS
    # ============================================
    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - first_name
        - last_name
      properties:
        username:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        preferences:
          type: object
          description: User preferences JSON
          additionalProperties: true

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        is_active:
          type: boolean
        preferences:
          type: object
          additionalProperties: true

    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: User ID (same as AAA service)
        username:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        preferences:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    # ============================================
    # USER ROLE SCHEMAS
    # ============================================
    UserRoleResponse:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
          description: AAA service user ID
        role_id:
          type: string
          description: E-commerce role ID
        is_active:
          type: boolean
        assigned_by:
          type: string
        assigned_at:
          type: string
          format: date-time
        expires_at:
