  /api/v1/user-roles:
    post:
      tags: [User Roles]
      summary: Assign a role to a user
      description: |
        Creates a new user-role assignment. Assigns an e-commerce role to a user.
        Note: This endpoint is currently not implemented (returns 501).
      operationId: assignRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role_id
              properties:
                user_id:
                  type: string
                  description: User ID from AAA service
                role_id:
                  type: string
                  description: E-commerce role ID
                notes:
                  type: string
                  description: Notes about this role assignment
                  maxLength: 1000
                expires_at:
                  type: string
                  format: date-time
                  description: Optional expiration date for this role
            example:
              user_id: "usr_abc123"
              role_id: "role_manager"
              notes: "Temporary manager role for Q4"
              expires_at: "2025-12-31T23:59:59Z"
      responses:
        "201":
          description: Role assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Role already assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
