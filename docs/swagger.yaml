basePath: /
definitions:
  internal_handlers_catalog.BulkPriceUpdateItem:
    properties:
      base_price:
        minimum: 0
        type: number
      currency:
        type: string
      id:
        type: string
    required:
    - base_price
    - id
    type: object
  internal_handlers_catalog.BulkPriceUpdateRequest:
    properties:
      effective_date:
        type: string
      reason:
        maxLength: 500
        type: string
      updates:
        items:
          $ref: '#/definitions/internal_handlers_catalog.BulkPriceUpdateItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - updates
    type: object
  internal_handlers_catalog.BulkPublishRequest:
    properties:
      effective_date:
        type: string
      item_ids:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
      visibility:
        enum:
        - PRIVATE
        - ORG
        - NETWORK
        - PUBLIC
        type: string
    required:
    - item_ids
    type: object
  internal_handlers_catalog.BulkUpdateItem:
    properties:
      id:
        type: string
      updates:
        $ref: '#/definitions/internal_handlers_catalog.UpdateCatalogItemRequest'
    required:
    - id
    - updates
    type: object
  internal_handlers_catalog.BulkUpdateRequest:
    properties:
      atomic:
        type: boolean
      items:
        items:
          $ref: '#/definitions/internal_handlers_catalog.BulkUpdateItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - items
    type: object
  internal_handlers_catalog.PriceUpdateRequest:
    properties:
      base_price:
        minimum: 0
        type: number
      currency:
        type: string
      effective_date:
        type: string
      promotion_end_date:
        type: string
      promotional:
        type: boolean
      reason:
        maxLength: 500
        type: string
    required:
    - base_price
    type: object
  internal_handlers_catalog.PublishProductToFPOsRequest:
    description: Request body for publishing a product to specific FPOs with pricing
      configuration
    properties:
      delivery_costs:
        additionalProperties:
          format: float64
          type: number
        description: Delivery costs per FPO (map of FPO ID to cost in INR)
        type: object
      fpo_ids:
        description: FPO organization IDs that should have access to this product
        items:
          type: string
        minItems: 1
        type: array
      platform_fee_percent:
        description: Platform commission percentage (0-100)
        example: 10
        maximum: 100
        minimum: 0
        type: number
    required:
    - delivery_costs
    - fpo_ids
    - platform_fee_percent
    type: object
  internal_handlers_catalog.PublishProductToFPOsResponse:
    description: Response after successfully publishing a product to FPOs
    properties:
      platform_fee_percent:
        description: |-
          Platform commission percentage applied
          @example 10.0
        example: 10
        type: number
      product_id:
        description: |-
          Product ID that was published
          @example "PROD00000001"
        example: PROD00000001
        type: string
      publish_state_id:
        description: |-
          Unique identifier for the publish state record
          @example "PUB00000001"
        example: PUB00000001
        type: string
      published_at:
        description: |-
          Timestamp when the product was published
          @example "2025-11-04T10:30:00Z"
        example: "2025-11-04T10:30:00Z"
        type: string
      status:
        description: |-
          Publishing status
          @example "published"
        example: published
        type: string
      visible_to_fpos:
        description: |-
          Number of FPOs that can now access this product
          @example 2
        example: 2
        type: integer
    type: object
  internal_handlers_catalog.PublishRequest:
    properties:
      effective_date:
        type: string
      notes:
        maxLength: 500
        type: string
      visibility:
        enum:
        - PRIVATE
        - ORG
        - NETWORK
        - PUBLIC
        type: string
    type: object
  internal_handlers_catalog.UnpublishRequest:
    properties:
      effective_date:
        type: string
      handle_active_orders:
        enum:
        - fulfill
        - cancel
        - transfer
        type: string
      reason:
        maxLength: 500
        type: string
    type: object
  internal_handlers_catalog.UpdateCatalogItemRequest:
    properties:
      attributes:
        additionalProperties: true
        type: object
      base_price:
        type: number
      category:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      sku:
        maxLength: 100
        type: string
      subcategory:
        maxLength: 100
        type: string
      tags:
        items:
          type: string
        type: array
      unit_of_measure:
        maxLength: 50
        type: string
      visibility:
        enum:
        - PRIVATE
        - ORG
        - NETWORK
        - PUBLIC
        type: string
    type: object
  internal_handlers_catalog.UpdateDeliveryCostsRequest:
    description: Request body for updating delivery costs for specific FPOs
    properties:
      delivery_costs:
        additionalProperties:
          format: float64
          type: number
        description: Updated delivery costs per FPO (map of FPO ID to cost in INR)
        type: object
    required:
    - delivery_costs
    type: object
  internal_handlers_health.Alert:
    properties:
      component:
        type: string
      level:
        type: string
      message:
        type: string
      resolved:
        type: boolean
      timestamp:
        type: string
    type: object
  internal_handlers_health.DashboardMetrics:
    properties:
      active_connections:
        type: integer
      avg_response_time_ms:
        type: number
      cpu_usage_percent:
        type: number
      error_rate:
        type: number
      memory_usage_percent:
        type: number
      requests_per_minute:
        type: number
    type: object
  internal_handlers_health.DatabaseMetrics:
    properties:
      connections:
        type: integer
      errors:
        type: integer
      latency_ms:
        type: integer
      status:
        type: string
    type: object
  internal_handlers_health.DependencyStatus:
    properties:
      last_checked:
        type: string
      latency_ms:
        type: integer
      message:
        type: string
      name:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  internal_handlers_health.DetailedHealthResponse:
    properties:
      dependencies:
        additionalProperties:
          $ref: '#/definitions/internal_handlers_health.HealthCheck'
        type: object
      message:
        type: string
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  internal_handlers_health.GC:
    properties:
      last_gc:
        type: string
      next_gc_bytes:
        type: integer
      num_gc:
        type: integer
      pause_total_ns:
        type: integer
    type: object
  internal_handlers_health.HTTPMetrics:
    properties:
      avg_response_time_ms:
        type: number
      error_rate:
        type: number
      requests_per_sec:
        type: number
      requests_total:
        type: integer
    type: object
  internal_handlers_health.HealthCheck:
    properties:
      latency:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  internal_handlers_health.Memory:
    properties:
      alloc_bytes:
        type: integer
      heap_alloc_bytes:
        type: integer
      heap_inuse_bytes:
        type: integer
      heap_released_bytes:
        type: integer
      heap_sys_bytes:
        type: integer
      num_gc:
        type: integer
      sys_bytes:
        type: integer
      total_alloc_bytes:
        type: integer
    type: object
  internal_handlers_health.MetricsResponse:
    properties:
      database:
        $ref: '#/definitions/internal_handlers_health.DatabaseMetrics'
      http:
        $ref: '#/definitions/internal_handlers_health.HTTPMetrics'
      system:
        $ref: '#/definitions/internal_handlers_health.SystemMetrics'
    type: object
  internal_handlers_health.ServiceStatus:
    properties:
      environment:
        type: string
      name:
        type: string
      status:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  internal_handlers_health.StatusDashboard:
    properties:
      alerts:
        items:
          $ref: '#/definitions/internal_handlers_health.Alert'
        type: array
      dependencies:
        items:
          $ref: '#/definitions/internal_handlers_health.DependencyStatus'
        type: array
      last_updated:
        type: string
      metrics:
        $ref: '#/definitions/internal_handlers_health.DashboardMetrics'
      service:
        $ref: '#/definitions/internal_handlers_health.ServiceStatus'
    type: object
  internal_handlers_health.SystemMetrics:
    properties:
      gc_stats:
        $ref: '#/definitions/internal_handlers_health.GC'
      go_version:
        type: string
      memory_usage:
        $ref: '#/definitions/internal_handlers_health.Memory'
      num_cpu:
        type: integer
      num_goroutines:
        type: integer
      uptime:
        type: string
    type: object
  internal_handlers_inventory.AdjustInventoryRequest:
    properties:
      adjustment:
        example: 10.5
        type: number
      reason:
        example: Stock correction after physical count
        type: string
    required:
    - adjustment
    - reason
    type: object
  internal_handlers_inventory.CreateInventoryLotRequest:
    properties:
      batch_number:
        example: BATCH-001
        type: string
      catalog_item_id:
        example: prod_123
        type: string
      expiry_date:
        example: "2024-12-31"
        type: string
      harvest_date:
        example: "2024-01-15"
        type: string
      initial_quantity:
        example: 100.5
        type: number
      lot_number:
        example: LOT-2024-001
        type: string
      lot_price:
        example: 25.5
        type: number
      metadata:
        example: '{"supplier": "Farm ABC"}'
        type: string
      quality_grade:
        example: A
        type: string
      storage_conditions:
        example: Temperature controlled, humidity 60%
        type: string
      warehouse_location:
        example: Warehouse A, Section 1
        type: string
    required:
    - catalog_item_id
    - initial_quantity
    - lot_number
    type: object
  internal_handlers_inventory.UpdateAlertConfigRequest:
    properties:
      alert_channels:
        example:
        - '["EMAIL"'
        - '"SMS"]'
        items:
          type: string
        type: array
      expiry_warning_days:
        example: 30
        minimum: 1
        type: integer
      low_stock_threshold:
        example: 100
        minimum: 0
        type: integer
    required:
    - expiry_warning_days
    - low_stock_threshold
    type: object
  internal_handlers_inventory.UpdateInventoryLotRequest:
    properties:
      expiry_date:
        example: "2024-12-31"
        type: string
      harvest_date:
        example: "2024-01-15"
        type: string
      lot_price:
        example: 30
        type: number
      metadata:
        example: '{"notes": "Quality improved"}'
        type: string
      quality_grade:
        example: A+
        type: string
      storage_conditions:
        example: Refrigerated, humidity 50%
        type: string
      warehouse_location:
        example: Warehouse B, Section 2
        type: string
    type: object
  internal_handlers_marketplace.AuctionSummary:
    properties:
      end_time:
        example: "2024-01-14T15:00:00Z"
        type: string
      listing_id:
        example: LST_1234567890
        type: string
      participants:
        example: 8
        type: integer
      start_time:
        example: "2024-01-14T10:00:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.ListingStatus'
        example: CLOSED
      title:
        example: Auction for Product PROD_123
        type: string
      total_bids:
        example: 12
        type: integer
      winner_id:
        example: USER_456
        type: string
      winning_bid:
        example: "1500.00"
        type: string
    type: object
  internal_handlers_marketplace.AuditEventResponse:
    properties:
      actor_id:
        example: USER_456
        type: string
      actor_type:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.ActorType'
        example: USER
      event_id:
        example: EVT_1234567890
        type: string
      event_type:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.AuctionEventType'
        example: BID_PLACED
      id:
        example: uuid-123
        type: string
      listing_id:
        example: LST_1234567890
        type: string
      summary:
        example: Bid placed on listing LST_1234567890 by USER_456
        type: string
      timestamp:
        example: "2024-01-14T10:30:00Z"
        type: string
    type: object
  internal_handlers_marketplace.AuditLogResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/internal_handlers_marketplace.AuditEventResponse'
        type: array
      pagination:
        $ref: '#/definitions/kisanlink-ecom_internal_common.PaginationMeta'
    type: object
  internal_handlers_marketplace.BidHistoryResponse:
    properties:
      bid_visibility:
        example: FULL
        type: string
      bids:
        items:
          $ref: '#/definitions/internal_handlers_marketplace.BidResponse'
        type: array
      can_view_bids:
        example: true
        type: boolean
      highest_bid:
        $ref: '#/definitions/internal_handlers_marketplace.BidResponse'
      last_updated:
        example: "2024-01-14T10:30:00Z"
        type: string
      listing_id:
        example: LST_1234567890
        type: string
      total_bids:
        example: 5
        type: integer
    type: object
  internal_handlers_marketplace.BidListResponse:
    properties:
      bids:
        items:
          $ref: '#/definitions/internal_handlers_marketplace.BidResponse'
        type: array
      pagination:
        $ref: '#/definitions/kisanlink-ecom_internal_common.PaginationMeta'
    type: object
  internal_handlers_marketplace.BidResponse:
    properties:
      auto_bid_limit:
        example: "1500.00"
        type: string
      bid_amount:
        example: "1200.00"
        type: string
      bid_id:
        example: BID_1234567890
        type: string
      bidder_id:
        example: USER_456
        type: string
      currency:
        example: INR
        type: string
      id:
        example: uuid-123
        type: string
      is_auto_bid:
        example: false
        type: boolean
      is_highest_bid:
        example: true
        type: boolean
      is_own_bid:
        example: false
        type: boolean
      listing_id:
        example: LST_1234567890
        type: string
      message:
        example: Interested in bulk purchase
        type: string
      outbid_at:
        example: "2024-01-14T11:30:00Z"
        type: string
      placed_at:
        example: "2024-01-14T10:30:00Z"
        type: string
      quantity:
        example: "100.5"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.BidStatus'
        example: ACTIVE
    type: object
  internal_handlers_marketplace.FilteredBidStatistics:
    properties:
      average_bid:
        example: "1200.00"
        type: string
      bid_range:
        example: 800.00 - 1500.00
        type: string
      highest_bid:
        example: "1500.00"
        type: string
      listing_id:
        example: LST_1234567890
        type: string
      participant_info:
        example: 8 unique bidders
        type: string
      total_bids:
        example: 12
        type: integer
      visible_bids:
        example: 8
        type: integer
    type: object
  internal_handlers_marketplace.ForceCloseListingRequest:
    properties:
      reason:
        example: Policy violation - fraudulent listing
        type: string
    required:
    - reason
    type: object
  internal_handlers_marketplace.HistoricalBidData:
    properties:
      access_level:
        example: FULL
        type: string
      bids:
        items:
          $ref: '#/definitions/internal_handlers_marketplace.BidResponse'
        type: array
      data_available:
        example: true
        type: boolean
      listing_id:
        example: LST_1234567890
        type: string
      requested_by:
        example: USER_123
        type: string
      time_range:
        example: 2024-01-14T10:00:00Z to 2024-01-14T15:00:00Z
        type: string
      total_bids:
        example: 12
        type: integer
    type: object
  internal_handlers_marketplace.ListingListResponse:
    properties:
      listings:
        items:
          $ref: '#/definitions/internal_handlers_marketplace.ListingResponse'
        type: array
      pagination:
        $ref: '#/definitions/kisanlink-ecom_internal_common.PaginationMeta'
    type: object
  internal_handlers_marketplace.ListingResponse:
    properties:
      asking_price:
        example: "1500.00"
        type: string
      auction_type:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.AuctionType'
        example: OPEN
      bid_count:
        example: 5
        type: integer
      bid_visibility:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.BidVisibility'
        example: FULL
      close_reason:
        example: Auction completed
        type: string
      closed_at:
        example: "2024-01-15T09:30:00Z"
        type: string
      created_at:
        example: "2024-01-14T10:30:00Z"
        type: string
      currency:
        example: INR
        type: string
      current_highest_bid_id:
        example: BID_987654321
        type: string
      expires_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      id:
        example: uuid-123
        type: string
      listing_duration_hours:
        example: 24
        type: integer
      listing_id:
        example: LST_1234567890
        type: string
      minimum_bid:
        example: "1000.00"
        type: string
      organization_id:
        example: ORG_789
        type: string
      pickup_location:
