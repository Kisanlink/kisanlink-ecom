    - quantity
    type: object
  internal_handlers_marketplace.RemoveBidRequest:
    properties:
      reason:
        example: Fraudulent bid detected
        type: string
    required:
    - reason
    type: object
  internal_handlers_marketplace.RevealedAuctionResults:
    properties:
      auction_end_time:
        example: "2024-01-14T15:00:00Z"
        type: string
      listing_id:
        example: LST_1234567890
        type: string
      results_available:
        example: true
        type: boolean
      status:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.ListingStatus'
        example: CLOSED
      total_bids:
        example: 12
        type: integer
      winner_id:
        example: USER_456
        type: string
      winning_bid:
        example: "1500.00"
        type: string
    type: object
  kisanlink-ecom_entities_models_common.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
  kisanlink-ecom_entities_models_marketplace.ActorType:
    enum:
    - USER
    - SYSTEM
    - ADMIN
    type: string
    x-enum-varnames:
    - ActorTypeUser
    - ActorTypeSystem
    - ActorTypeAdmin
  kisanlink-ecom_entities_models_marketplace.AuctionEventType:
    enum:
    - LISTING_CREATED
    - BID_PLACED
    - BID_OUTBID
    - AUTO_BID_TRIGGERED
    - LISTING_CLOSED
    - LISTING_EXPIRED
    - LISTING_CANCELLED
    - BID_REMOVED
    - LISTING_UPDATED
    type: string
    x-enum-varnames:
    - EventListingCreated
    - EventBidPlaced
    - EventBidOutbid
    - EventAutoBidTriggered
    - EventListingClosed
    - EventListingExpired
    - EventListingCancelled
    - EventBidRemoved
    - EventListingUpdated
  kisanlink-ecom_entities_models_marketplace.AuctionType:
    enum:
    - OPEN
    - CLOSED
    type: string
    x-enum-comments:
      AuctionTypeClosed: Bid prices hidden until auction ends
      AuctionTypeOpen: All bid prices visible during auction
    x-enum-descriptions:
    - All bid prices visible during auction
    - Bid prices hidden until auction ends
    x-enum-varnames:
    - AuctionTypeOpen
    - AuctionTypeClosed
  kisanlink-ecom_entities_models_marketplace.BidStatus:
    enum:
    - ACTIVE
    - OUTBID
    - WINNING
    - EXPIRED
    - REMOVED
    type: string
    x-enum-varnames:
    - BidStatusActive
    - BidStatusOutbid
    - BidStatusWinning
    - BidStatusExpired
    - BidStatusRemoved
  kisanlink-ecom_entities_models_marketplace.BidVisibility:
    enum:
    - FULL
    - PARTIAL
    - MINIMAL
    - HIDDEN
    type: string
    x-enum-comments:
      BidVisibilityFull: Show all bid details based on auction type
      BidVisibilityHidden: No bid information visible
      BidVisibilityMinimal: Show only bid count
      BidVisibilityPartial: Show bid count and highest amount only
    x-enum-descriptions:
    - Show all bid details based on auction type
    - Show bid count and highest amount only
    - Show only bid count
    - No bid information visible
    x-enum-varnames:
    - BidVisibilityFull
    - BidVisibilityPartial
    - BidVisibilityMinimal
    - BidVisibilityHidden
  kisanlink-ecom_entities_models_marketplace.ListingStatus:
    enum:
    - ACTIVE
    - CLOSED
    - EXPIRED
    - CANCELLED
    - EXPIRED_NO_BIDS
    type: string
    x-enum-varnames:
    - ListingStatusActive
    - ListingStatusClosed
    - ListingStatusExpired
    - ListingStatusCancelled
    - ListingStatusExpiredNoBids
  kisanlink-ecom_entities_models_marketplace.ListingVisibility:
    enum:
    - PRIVATE
    - PUBLIC
    - NETWORK
