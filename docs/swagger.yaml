        - BearerAuth: []
      summary: Remove a bid (Admin)
      tags:
        - Admin
  /admin/v1/marketplace/listings:
    get:
      consumes:
        - application/json
      description:
        Retrieve all marketplace listings with admin privileges - no visibility
        restrictions
      parameters:
        - description: Filter by status
          enum:
            - ACTIVE
            - CLOSED
            - EXPIRED
            - CANCELLED
          in: query
          name: status
          type: string
        - description: Filter by seller ID
          in: query
          name: seller_id
          type: string
        - description: Filter by organization ID
          in: query
          name: organization_id
          type: string
        - description: Filter by product ID
          in: query
          name: product_id
          type: string
        - description: Filter by visibility
          enum:
            - PRIVATE
            - PUBLIC
            - NETWORK
            - ORGANIZATION
          in: query
          name: visibility
          type: string
        - description: Filter by auction type
          enum:
            - OPEN
            - CLOSED
          in: query
          name: auction_type
          type: string
        - description: Filter by minimum price
          in: query
          name: min_price
          type: string
        - description: Filter by maximum price
          in: query
          name: max_price
          type: string
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 20
          description: Items per page
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Listings retrieved successfully
          schema:
            allOf:
