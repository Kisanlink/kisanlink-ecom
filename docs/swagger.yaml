basePath: /
definitions:
  auth.LoginRequest:
    properties:
      password:
        maxLength: 255
        minLength: 6
        type: string
      username:
        maxLength: 255
        type: string
    required:
      - password
      - username
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 100
        type: string
      last_name:
        maxLength: 100
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
      phone:
        maxLength: 20
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
      - email
      - first_name
      - last_name
      - password
      - username
    type: object
  catalog.CatalogItemType:
    enum:
      - PRODUCT
      - SERVICE
      - LABOUR
    type: string
    x-enum-varnames:
      - CatalogItemTypeProduct
      - CatalogItemTypeService
      - CatalogItemTypeLabour
  catalog.CreateCatalogItemRequest:
    properties:
      attributes:
        additionalProperties: true
        type: object
      base_price:
        minimum: 0
        type: number
      category:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      images:
        items:
          type: string
        type: array
      item_type:
        allOf:
          - $ref: "#/definitions/catalog.CatalogItemType"
        enum:
          - PRODUCT
          - SERVICE
          - LABOUR
      name:
        maxLength: 255
        type: string
      sku:
        maxLength: 100
        type: string
      subcategory:
        maxLength: 100
        type: string
      tags:
        items:
          type: string
        type: array
      unit_of_measure:
        maxLength: 50
        type: string
      visibility:
        allOf:
          - $ref: "#/definitions/catalog.VisibilityType"
        enum:
          - PRIVATE
          - ORG
          - NETWORK
          - PUBLIC
    required:
      - base_price
      - item_type
      - name
    type: object
  catalog.ProductResponse:
    properties:
      attributes:
        additionalProperties: true
        type: object
      base_price:
        type: number
      category:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      dimensions:
        additionalProperties: true
        type: object
      id:
        type: string
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      item_type:
        type: string
      name:
        type: string
      organization_id:
        type: string
      perishable:
        type: boolean
      shelf_life_days:
        type: integer
      sku:
        type: string
      subcategory:
        type: string
      tags:
        items:
          type: string
        type: array
      unit_of_measure:
        type: string
      updated_at:
        type: string
      visibility:
        type: string
      weight:
        type: number
    type: object
  catalog.UpdateCatalogItemRequest:
    properties:
      attributes:
        additionalProperties: true
        type: object
      base_price:
        minimum: 0
        type: number
      category:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      sku:
        maxLength: 100
        type: string
      subcategory:
        maxLength: 100
        type: string
      tags:
        items:
          type: string
        type: array
      unit_of_measure:
        maxLength: 50
        type: string
      visibility:
        allOf:
          - $ref: "#/definitions/catalog.VisibilityType"
        enum:
          - PRIVATE
          - ORG
          - NETWORK
          - PUBLIC
    type: object
  catalog.VisibilityType:
    enum:
      - PRIVATE
      - ORG
      - NETWORK
      - PUBLIC
    type: string
    x-enum-varnames:
      - VisibilityPrivate
      - VisibilityOrg
      - VisibilityNetwork
      - VisibilityPublic
  common.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
  common.PaginationMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  common.Response:
    properties:
      data: {}
      error:
        $ref: "#/definitions/common.ResponseError"
      meta:
        $ref: "#/definitions/common.ResponseMeta"
    type: object
  common.ResponseError:
    properties:
      code:
        type: string
      details:
        additionalProperties: true
        type: object
      message:
        type: string
    type: object
  common.ResponseMeta:
    properties:
      extra:
        additionalProperties: true
        type: object
      pagination:
        $ref: "#/definitions/common.PaginationMeta"
      timestamp:
        type: string
      trace_id:
        type: string
    type: object
  entities_requests_orders.Address:
    properties:
      city:
        maxLength: 100
        type: string
      country:
        maxLength: 100
        type: string
      postal_code:
        maxLength: 20
        type: string
      state:
        maxLength: 100
        type: string
      street:
        maxLength: 255
        type: string
    required:
      - city
      - country
      - postal_code
      - state
      - street
    type: object
  handlers.CreatePermissionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
      - name
    type: object
  handlers.CreateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
      - name
    type: object
  handlers.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
      - name
    type: object
  handlers.UpdateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
      - name
    type: object
  orders.CreateOrderItemRequest:
    properties:
      catalog_item_id:
        type: string
      catalog_item_type:
        enum:
          - product
          - service
          - labour
        type: string
      notes:
        type: string
      quantity:
        type: number
      unit_price:
        minimum: 0
        type: number
    required:
      - catalog_item_id
      - catalog_item_type
      - quantity
      - unit_price
    type: object
  orders.CreateOrderRequest:
    properties:
      buyer_organization_id:
        type: string
      items:
        items:
          $ref: "#/definitions/orders.CreateOrderItemRequest"
        minItems: 1
        type: array
      metadata:
        additionalProperties: true
        type: object
      notes:
        type: string
      seller_organization_id:
        type: string
      shipping_address:
        $ref: "#/definitions/entities_requests_orders.Address"
    required:
      - buyer_organization_id
      - items
      - seller_organization_id
    type: object
  orders.OrderItemResponse:
    properties:
      catalog_item_id:
        type: string
      catalog_item_name:
        type: string
      catalog_item_sku:
        type: string
      catalog_item_type:
        type: string
      created_at:
        type: string
      discount_amount:
        type: number
      discount_rate:
        type: number
      id:
        type: string
      metadata:
        type: string
      order_id:
        type: string
      quantity:
        type: number
      tax_amount:
        type: number
      tax_rate:
        type: number
      total_price:
        type: number
      unit_price:
        type: number
      updated_at:
        type: string
    type: object
  orders.OrderResponse:
    properties:
      actual_delivery_date:
        type: string
      buyer_organization_id:
        type: string
      buyer_user_id:
        type: string
      created_at:
        type: string
      discount_amount:
        type: number
      estimated_delivery_date:
        type: string
      id:
        type: string
      items:
        items:
          $ref: "#/definitions/orders.OrderItemResponse"
        type: array
      metadata:
        type: string
      notes:
        type: string
      order_number:
        type: string
      seller_organization_id:
        type: string
      shipping_address:
        type: string
      shipping_amount:
        type: number
      status:
        type: string
      status_history:
        items:
          $ref: "#/definitions/orders.OrderStatusHistoryResponse"
        type: array
      subtotal_amount:
        type: number
      tax_amount:
        type: number
      total_amount:
        type: number
      updated_at:
        type: string
    type: object
  orders.OrderStatus:
    enum:
      - pending
      - confirmed
      - paid
      - shipped
      - delivered
      - completed
      - cancelled
      - refunded
    type: string
    x-enum-varnames:
      - OrderStatusPending
      - OrderStatusConfirmed
      - OrderStatusPaid
      - OrderStatusShipped
      - OrderStatusDelivered
      - OrderStatusCompleted
      - OrderStatusCancelled
      - OrderStatusRefunded
  orders.OrderStatusHistoryResponse:
    properties:
      changed_by_organization_id:
        type: string
      changed_by_user_id:
        type: string
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: string
      metadata:
        type: string
      order_id:
        type: string
      reason:
        type: string
      to_status:
        type: string
    type: object
  orders.UpdateOrderStatusRequest:
    properties:
      reason:
        maxLength: 500
        type: string
      status:
        allOf:
          - $ref: "#/definitions/orders.OrderStatus"
        enum:
          - pending
          - confirmed
          - paid
          - shipped
          - delivered
          - completed
          - cancelled
          - refunded
    required:
      - reason
      - status
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the KisanLink E-commerce service API.
  title: KisanLink E-commerce API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
        - application/json
      description: Authenticate user and return access token
      parameters:
        - description: Login credentials
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/auth.LoginRequest"
      produces:
        - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: "#/definitions/common.Response"
        "400":
          description: Invalid request
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "401":
          description: Invalid credentials
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: User Login
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      consumes:
        - application/json
      description: Logout user and invalidate access token
      produces:
        - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: "#/definitions/common.Response"
        "401":
          description: Unauthorized
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      security:
        - BearerAuth: []
      summary: User Logout
      tags:
        - Authentication
  /api/v1/auth/register:
    post:
      consumes:
        - application/json
      description: Register a new user account
      parameters:
        - description: User registration data
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/auth.RegisterRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Registration successful
          schema:
            $ref: "#/definitions/common.Response"
        "400":
          description: Invalid request
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "409":
          description: User already exists
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "500":
          description: Internal server error
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: User Registration
      tags:
        - Authentication
  /api/v1/catalog/products:
    get:
      consumes:
        - application/json
      description: Retrieve a list of products with filtering and pagination
      parameters:
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 20
          description: Items per page
          in: query
          name: limit
          type: integer
        - description: Filter by category
          in: query
          name: category
          type: string
        - description: Filter by organization ID
          in: query
          name: org_id
          type: string
        - description: Filter by active status
          in: query
          name: is_active
          type: boolean
        - description: Search term
          in: query
          name: search
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    items:
                      $ref: "#/definitions/catalog.ProductResponse"
                    type: array
                  meta:
                    allOf:
                      - $ref: "#/definitions/common.ResponseMeta"
                      - properties:
                          pagination:
                            $ref: "#/definitions/common.PaginationMeta"
                        type: object
                type: object
      summary: List products
      tags:
        - products
    post:
      consumes:
        - application/json
      description: Create a new product in the catalog
      parameters:
        - description: Bearer token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Product information
          in: body
          name: product
          required: true
          schema:
            $ref: "#/definitions/catalog.CreateCatalogItemRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    $ref: "#/definitions/catalog.ProductResponse"
                type: object
        "400":
          description: Bad Request
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "403":
          description: Forbidden
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: Create a new product
      tags:
        - products
  /api/v1/catalog/products/{id}:
    delete:
      consumes:
        - application/json
      description: Delete a product from the catalog
      parameters:
        - description: Bearer token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Product ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    type: string
                type: object
        "400":
          description: Bad Request
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "403":
          description: Forbidden
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "404":
          description: Not Found
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: Delete a product
      tags:
        - products
    get:
      consumes:
        - application/json
      description: Retrieve a product by its ID
      parameters:
        - description: Product ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    $ref: "#/definitions/catalog.ProductResponse"
                type: object
        "404":
          description: Not Found
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: Get product by ID
      tags:
        - products
    put:
      consumes:
        - application/json
      description: Update an existing product
      parameters:
        - description: Bearer token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Product ID
          in: path
          name: id
          required: true
          type: string
        - description: Product updates
          in: body
          name: product
          required: true
          schema:
            $ref: "#/definitions/catalog.UpdateCatalogItemRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    $ref: "#/definitions/catalog.ProductResponse"
                type: object
        "400":
          description: Bad Request
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "403":
          description: Forbidden
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "404":
          description: Not Found
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: Update a product
      tags:
        - products
  /api/v1/orders:
    get:
      consumes:
        - application/json
      description: Retrieve a list of orders with filtering and pagination
      parameters:
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 20
          description: Items per page
          in: query
          name: limit
          type: integer
        - description: Filter by buyer ID
          in: query
          name: buyer_id
          type: string
        - description: Filter by seller ID
          in: query
          name: seller_id
          type: string
        - description: Filter by status
          in: query
          name: status
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    items:
                      $ref: "#/definitions/orders.OrderResponse"
                    type: array
                  meta:
                    allOf:
                      - $ref: "#/definitions/common.ResponseMeta"
                      - properties:
                          pagination:
                            $ref: "#/definitions/common.PaginationMeta"
                        type: object
                type: object
      summary: List orders
      tags:
        - orders
    post:
      consumes:
        - application/json
      description: Create a new order with items
      parameters:
        - description: Bearer token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Order information
          in: body
          name: order
          required: true
          schema:
            $ref: "#/definitions/orders.CreateOrderRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    $ref: "#/definitions/orders.OrderResponse"
                type: object
        "400":
          description: Bad Request
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
        "403":
          description: Forbidden
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: Create a new order
      tags:
        - orders
  /api/v1/orders/{id}:
    delete:
      consumes:
        - application/json
      description: Delete an order (cancel if not shipped)
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Order deleted successfully
          schema:
            type: object
        "400":
          description: Invalid order ID
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "404":
          description: Order not found
          schema:
            type: object
        "409":
          description: Order cannot be cancelled
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      summary: Delete Order
      tags:
        - Orders
    get:
      consumes:
        - application/json
      description: Retrieve an order by its ID
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  data:
                    $ref: "#/definitions/orders.OrderResponse"
                type: object
        "404":
          description: Not Found
          schema:
            allOf:
              - $ref: "#/definitions/common.Response"
              - properties:
                  error:
                    $ref: "#/definitions/common.ResponseError"
                type: object
      summary: Get order by ID
      tags:
        - orders
    put:
      consumes:
        - application/json
      description: Update an existing order's status
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          type: string
        - description: Order update data
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/orders.UpdateOrderStatusRequest"
      produces:
        - application/json
      responses:
        "200":
          description: Order updated successfully
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
