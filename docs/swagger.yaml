      visibility:
        allOf:
        - $ref: '#/definitions/kisanlink-ecom_entities_models_marketplace.ListingVisibility'
        example: PUBLIC
    type: object
  internal_handlers_marketplace.MarketplaceStatsResponse:
    properties:
