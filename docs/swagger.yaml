host: localhost:8080
info:
  contact: {}
  description: This is the KisanLink E-commerce service API.
  title: KisanLink E-commerce API
  version: "1.0"
paths:
  /admin/v1/marketplace/audit-log:
    get:
      consumes:
        - application/json
      description:
        Retrieve audit log of marketplace activities for compliance and
        monitoring
      parameters:
        - description: Filter by listing ID
          in: query
          name: listing_id
          type: string
        - description: Filter by event type
          enum:
            - LISTING_CREATED
            - BID_PLACED
            - BID_OUTBID
            - LISTING_CLOSED
            - LISTING_EXPIRED
          in: query
          name: event_type
          type: string
        - description: Filter by actor ID
          in: query
          name: actor_id
          type: string
        - description: Filter events from this time (RFC3339 format)
          in: query
          name: time_from
          type: string
        - description: Filter events to this time (RFC3339 format)
          in: query
          name: time_to
          type: string
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 50
          description: Items per page
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Audit log retrieved successfully
          schema:
            allOf:
              - $ref: "#/definitions/common.APIResponse"
              - properties:
                  data:
                    $ref: "#/definitions/marketplace.AuditLogResponse"
                type: object
        "400":
          description: Invalid request parameters
          schema:
            allOf:
              - $ref: "#/definitions/common.APIResponse"
              - properties:
                  error:
                    $ref: "#/definitions/common.APIError"
                type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
              - $ref: "#/definitions/common.APIResponse"
              - properties:
                  error:
                    $ref: "#/definitions/common.APIError"
                type: object
        "403":
          description: Insufficient privileges
          schema:
            allOf:
              - $ref: "#/definitions/common.APIResponse"
              - properties:
                  error:
                    $ref: "#/definitions/common.APIError"
                type: object
        "500":
          description: Internal server error
          schema:
            allOf:
              - $ref: "#/definitions/common.APIResponse"
              - properties:
                  error:
                    $ref: "#/definitions/common.APIError"
                type: object
      security:
        - BearerAuth: []
      summary: Get marketplace audit log (Admin)
      tags:
        - Admin
  /admin/v1/marketplace/bids/{id}:
    delete:
      consumes:
        - application/json
      description: Remove a fraudulent or policy-violating bid from the marketplace
      parameters:
        - description: Bid ID
          in: path
          name: id
          required: true
          type: string
